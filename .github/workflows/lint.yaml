name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: Home Assistant app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Run Home Assistant app linter
        uses: frenck/action-addon-linter@v2.21
        with:
          path: ./uponor_smatrix_wave

  python:
    name: Python package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        working-directory: ./uponor_smatrix_wave
        run: python -m pip install ".[receiver,mqtt]"
      - name: Import package
        working-directory: ./uponor_smatrix_wave
        run: python -c "import uponor_smatrix_wave_x165"
