[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uponor-smatrix-wave-x165"
version = "0.1.0"
description = "Local receive-only T-165 / X-165 Smatrix Wave decoder and MQTT bridge"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
receiver = ["numpy>=1.26,<3"]
mqtt = ["paho-mqtt>=2.1,<3"]

[project.scripts]
uponor-receiver = "uponor_smatrix_wave_x165.receiver:main"

[tool.setuptools.packages.find]
include = ["uponor_smatrix_wave_x165*", "uponor"]
